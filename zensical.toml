[project.theme]
language = "zh"
features = ["navigation.sections", "navigation.top", "navigation.path", "navigation.prune", "content.code.copy", "search.highlight", "search.suggest"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
pymdownx.highlight = {}
pymdownx.superfences = {}
toc = { permalink = true }
