name: Validate local corpus

# Only a maintainer can dispatch this on main. The dataset stays on the runner.
# Register a trusted Linux runner with the krieg-corpus label before using it.
on:
  workflow_dispatch:
    inputs:
      corpus_root:
        description: Absolute path to the locally installed game or mod corpus
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: local-corpus
  cancel-in-progress: false

jobs:
  corpus:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, krieg-corpus]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Parse and verify the local corpus
        env:
          CORPUS_ROOT: ${{ inputs.corpus_root }}
        # Exercise the supported CLI path, which supplies corpus heap/GC defaults.
        run: node dist/cli.js corpus "$CORPUS_ROOT" --out "$RUNNER_TEMP/krieg-corpus-report.json"
      - name: Retain the validation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: corpus-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/krieg-corpus-report.json
          if-no-files-found: warn
          retention-days: 7
